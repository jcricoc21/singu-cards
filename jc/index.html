:root{--navy:#0A355B;--ink:#14212e;--muted:#5b6b7a;--bg:#f3f5f8;--card:#fff;--line:#e3e8ee}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center;min-height:100vh}
.card{width:100%;max-width:420px;background:var(--card);min-height:100vh}

main{padding:16px 24px 32px;text-align:center}
h1{font-size:24px;margin:12px 0 2px}
.role{color:var(--muted);margin:0}
.tag{color:var(--muted);font-size:14px;margin:16px 0 24px}
.btn{display:block;padding:14px;border-radius:12px;border:2px solid var(--navy);color:var(--navy);text-decoration:none;font-weight:650;margin-bottom:10px}
@media (prefers-color-scheme:dark){.btn{color:#cfe0f2;border-color:#4f7aa6}}
.btn.primary{background:var(--navy);color:#fff;border-color:var(--navy)}
.links{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px}
.event{display:none;margin:14px auto 0;padding:6px 14px;border-radius:999px;background:#e6eef7;color:var(--navy);font-size:14px;font-weight:600;width:fit-content}
@media (prefers-color-scheme:dark){.event{background:#1c3550;color:#cfe0f2}}
.ic{width:20px;height:20px;flex:none}
.emoji{font-size:18px;line-height:20px;width:auto}
.btn,.links a{display:flex;align-items:center;justify-content:center;gap:8px}
.links a{padding:12px;border:1px solid var(--line);border-radius:10px;color:var(--ink);text-decoration:none;font-size:14px}
</style>

(() => {
  const EVENTS = {"exni": "EXNI 2026", "ampi": "AMPI Guadalajara", "apiej": "APIEJ", "ampip": "AMPIP", "ifma": "IFMA México"};
  const T = {"save": "Guardar contacto", "meet": "Agendar una llamada", "wa": "WhatsApp", "mail": "Correo", "call": "Llamar", "li": "Conectar en LinkedIn", "diag": "Diagnóstico de operación · 60 s", "web": "singu.com", "met": "Mucho gusto en {ev}", "wa_base": "Hola {first}, me interesa conocer más de SINGU.", "wa_ev": " Nos conocimos en {ev}.", "subj": "Nos conocimos en {ev}"};

  const ev = EVENTS[code];
  if (!ev) return;
  const fill = s => s.replace("{ev}", ev).replace("{first}", "Juan");
  const tag = document.getElementById("event");
  tag.textContent = fill(T.met); tag.style.display = "block";
  const wa = document.querySelector('[data-k="wa"]');
  if (wa) wa.href = wa.href.split("?")[0] + "?text=" + encodeURIComponent(fill(T.wa_base) + fill(T.wa_ev));
  const mail = document.querySelector('[data-k="mail"]');
  if (mail) mail.href += "?subject=" + encodeURIComponent(fill(T.subj));
  const diag = document.querySelector('[data-k="diag"]');
  if (diag) diag.href = "diagnostico/?e=" + encodeURIComponent(code);
  const meet = document.querySelector('[data-k="meet"]');
  if (meet) {
    const u = new URL(meet.href);
    u.searchParams.set("utm_source", "tarjeta"); u.searchParams.set("utm_medium", "evento"); u.searchParams.set("utm_campaign", code);
    meet.href = u.toString();
  }
})();
